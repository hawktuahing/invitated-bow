<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Конверт — варианты открытия</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Manrope:wght@400;500&display=swap">
  <style>
    :root { --wine: #6b303f; --paper: #f7f1e7; --muted: #766768; --card: #f9f3e9; }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 28px 20px 60px;
      background: var(--paper);
      color: var(--wine);
      font: 400 14px/18px "Manrope", system-ui, sans-serif;
    }
    h1 { margin: 0 0 6px; font: 500 26px/30px "Cormorant Garamond", serif; }
    .lede { margin: 0 0 24px; color: var(--muted); }
    .row { display: flex; flex-wrap: wrap; gap: 18px; }
    .tile { width: 236px; }
    .frame {
      width: 236px;
      height: 236px;
      overflow: hidden;
      border: 0.6px solid #cfbab0;
      border-radius: 10px;
      background: var(--paper);
      cursor: pointer;
    }
    .env {
      position: relative;
      width: 393px;
      height: 393px;
      transform-origin: 50% 60%;
      zoom: 0.6;
      perspective: 1100px;
    }
    .env__base, .env__top, .env__flap {
      position: absolute;
      inset: 0;
      background: url("assets/img/envelope.jpg") 100% 0 / 200% 100% no-repeat;
    }
    /* Everything below the fold: the pocket, and the inside the flap is covering. */
    .env__base { clip-path: inset(112px 0 0 0); }
    /* Everything above it — the folded-back flap and the head of the card — only shows once the
       flap has swung out of the way. */
    .env__top { clip-path: inset(0 0 281px 0); opacity: 0; }
    .env__flap {
      background-position: 0 0;
      transform-origin: 50% 118px;
      backface-visibility: hidden;
      clip-path: polygon(24px 112px, 369px 112px, 369px 150px, 245px 266px, 24px 150px);
    }
    .env__card {
      position: absolute;
      left: 78px;
      top: 74px;
      width: 240px;
      height: 168px;
      padding-top: 26px;
      background: var(--card);
      text-align: center;
      color: var(--wine);
    }
    .env__day { font: 500 42px/46px "Cormorant Garamond", serif; }
    .env__month { font: 500 22px/26px "Cormorant Garamond", serif; }
    .env__time { font: 400 12px/16px "Manrope", sans-serif; }
    .name { margin: 8px 0 2px; font: 500 17px/20px "Cormorant Garamond", serif; }
    .note { color: var(--muted); font-size: 12px; line-height: 16px; }
    .bar { display: flex; align-items: center; gap: 12px; margin-bottom: 20px; }
    button {
      padding: 8px 14px;
      border: 0.6px solid #cfbab0;
      border-radius: 999px;
      background: #fcf9f3;
      color: var(--wine);
      font: 400 13px/16px "Manrope", sans-serif;
      cursor: pointer;
    }
    .speed { color: var(--muted); }
  </style>
</head>
<body>
  <h1>Конверт — пять вариантов открытия</h1>
  <p class="lede">Нажмите на конверт, чтобы проиграть ещё раз. Картинка настоящая, из макета.</p>
  <div class="bar">
    <button id="all">Проиграть все</button>
    <label class="speed">скорость <input id="speed" type="range" min="40" max="160" value="100"></label>
  </div>
  <div class="row" id="row"></div>

<script>
const VARIANTS = [
  {
    name: "1 · Створка",
    note: "Створка отходит вверх и назад, как настоящая бумага. Карточка остаётся в конверте.",
    frames: (p) => ({ flap: -168 * ease(p / 0.9) }),
  },
  {
    name: "2 · Створка и карточка",
    note: "Створка открывается, следом карточка выезжает из кармана и мягко встаёт на место.",
    frames: (p) => ({ flap: -168 * ease(clamp(p / 0.62)), card: 34 * out(clamp((p - 0.58) / 0.42)) }),
  },
  {
    name: "3 · С наклоном",
    note: "Конверт слегка отклоняется назад, пока открывается створка, и возвращается вместе с карточкой.",
    frames: (p) => ({
      flap: -168 * ease(clamp(p / 0.62)),
      card: 30 * out(clamp((p - 0.58) / 0.42)),
      tilt: 13 * Math.sin(Math.PI * clamp(p / 0.85)),
    }),
  },
  {
    name: "4 · С подъёмом",
    note: "Конверт приподнимается навстречу, открывается и опускается обратно — с тенью под ним.",
    frames: (p) => {
      const lift = Math.sin(Math.PI * clamp(p / 0.9));
      return { flap: -168 * ease(clamp((p - 0.12) / 0.62)), card: 30 * out(clamp((p - 0.66) / 0.34)), scale: 1 + 0.06 * lift, shadow: lift };
    },
  },
  {
    name: "5 · Жёсткая бумага",
    note: "Створка идёт рывком, чуть отыгрывает назад, как плотная бумага, и только потом ложится.",
    frames: (p) => {
      let a;
      if (p < 0.34) a = -104 * out(p / 0.34);
      else if (p < 0.46) a = -104 + 16 * out((p - 0.34) / 0.12);
      else a = -88 - 80 * ease(clamp((p - 0.46) / 0.42));
      return { flap: a, card: 26 * out(clamp((p - 0.7) / 0.3)) };
    },
  },
];

const clamp = (n) => Math.max(0, Math.min(1, n));
const ease = (n) => { const t = clamp(n); return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const out = (n) => 1 - Math.pow(1 - clamp(n), 3);
const row = document.getElementById("row");
const speed = document.getElementById("speed");

const tiles = VARIANTS.map((v) => {
  const tile = document.createElement("div");
  tile.className = "tile";
  tile.innerHTML = `
    <div class="frame">
      <div class="env">
        <div class="env__base"></div>
        <div class="env__top"></div>
        <div class="env__card">
          <div class="env__day">18</div>
          <div class="env__month">September 2027</div>
          <div class="env__time">Saturday · 4:00 PM</div>
        </div>
        <div class="env__flap"></div>
      </div>
    </div>
    <div class="name">${v.name}</div>
    <div class="note">${v.note}</div>`;
  row.appendChild(tile);
  const env = tile.querySelector(".env");
  const item = {
    v, env,
    flap: tile.querySelector(".env__flap"),
    top: tile.querySelector(".env__top"),
    card: tile.querySelector(".env__card"),
    start: 0, playing: false,
  };
  tile.querySelector(".frame").addEventListener("click", () => play(item));
  return item;
});

function draw(item, p) {
  const s = item.v.frames(p);
  const flap = s.flap || 0;
  item.flap.style.transform = `rotateX(${flap}deg)`;
  // Past edge-on the underside would be wrong pixels, so the flap hands over to the open photo.
  item.flap.style.opacity = flap < -104 ? Math.max(0, 1 - (-flap - 104) / 30) : 1;
  // The open photo's own folded flap takes over as ours goes edge-on.
  item.top.style.opacity = Math.max(0, Math.min(1, (-flap - 86) / 34));
  item.card.style.transform = `translateY(${-(s.card || 0)}px)`;
  item.card.style.boxShadow = s.card ? `0 ${2 + s.card * 0.3}px ${6 + s.card * 0.5}px rgba(67,47,50,${0.05 + s.card * 0.004})` : "none";
  item.env.style.transform = `rotateX(${s.tilt || 0}deg) scale(${s.scale || 1})`;
  item.env.style.filter = s.shadow ? `drop-shadow(0 ${8 * s.shadow}px ${18 * s.shadow}px rgba(67,47,50,${0.18 * s.shadow}))` : "none";
}

function play(item) {
  item.start = performance.now();
  item.playing = true;
}

function tick(now) {
  const duration = 2200 * (100 / speed.value);
  for (const item of tiles) {
    if (!item.playing) continue;
    const p = (now - item.start) / duration;
    draw(item, Math.min(1, p));
    if (p >= 1) item.playing = false;
  }
  requestAnimationFrame(tick);
}

document.getElementById("all").addEventListener("click", () => tiles.forEach(play));
tiles.forEach((item) => draw(item, 0));
requestAnimationFrame(tick);
setTimeout(() => tiles.forEach(play), 400);
</script>
</body>
</html>
